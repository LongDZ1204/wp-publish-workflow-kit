name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python workflows/wp-publish/scripts/wp_selftest.py
      - run: python -m unittest discover -s workflows/wp-publish/tests -p 'test_*.py'
      - run: python -m unittest discover -s skills/wp-publish-new/tests -p 'test_*.py'
      - run: python -m unittest discover -s skills/wp-rest-publish/tests -p 'test_*.py'
      - run: python -m unittest discover -s skills/image-onpage/tests -p 'test_*.py'
      - run: python -m pytest tools/strong-to-b/test_strong_to_b.py -q
      - run: python scripts/check_distribution.py
